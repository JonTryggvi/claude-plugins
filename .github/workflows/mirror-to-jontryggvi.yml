name: Mirror to JonTryggvi

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  mirror:
    if: github.repository == 'Avista/claude-plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to JonTryggvi/claude-plugins
        env:
          PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          git remote add mirror https://JonTryggvi:${PAT}@github.com/JonTryggvi/claude-plugins.git
          git push mirror main --force
